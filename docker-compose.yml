services:
  api:
    build: ./backend
    env_file:
      - backend/.env
    environment:
      - API_KEY=${BACKEND_API_KEY:?Set BACKEND_API_KEY in frontend/.env}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
