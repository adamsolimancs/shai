name: Database baseline

on:
  pull_request:
    paths:
      - 'database/**'
      - 'backend/**'
      - '.github/workflows/database.yml'
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'backend/**'
      - '.github/workflows/database.yml'

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: pip install ./backend
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - name: Reconstruct and exercise atomic snapshot publication and accounts
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          python database/tests/test_baseline.py
