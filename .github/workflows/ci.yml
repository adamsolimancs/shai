name: PR CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workers: ${{ steps.filter.outputs.workers }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            workers:
              - 'workers/**'
              - '.github/workflows/ingest.yml'
              - '.github/workflows/ci.yml'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest

      - name: Install local Redis for rate-limit integration
        run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools

      - name: Atomic Redis visitor and service rate limits
        run: python -m integration.rate_limit_redis

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test

      - name: Install Chromium for fixture journeys
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile fixture journeys
        run: npm run test:e2e

      - name: Frontend build
        env:
          BACKEND_API_BASE_URL: http://localhost:8080
          BACKEND_API_KEY: test-key
          BACKEND_API_TIMEOUT_MS: 10000
          NBA_DEFAULT_SEASON: 2026-27
          AUTH_SECRET: test-auth-secret
        run: npm run build

  workers:
    needs: changes
    if: needs.changes.outputs.workers == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install worker dependencies
        run: npm ci

      - name: Worker tests
        run: npm run test

      - name: Install local services for worker integration
        run: sudo apt-get update && sudo apt-get install -y redis-server redis-tools postgresql postgresql-contrib

      - name: Real Redis lease integration
        run: npm run test:lease-integration

      - name: Empty-database resumable bootstrap integration
        run: |
          export PATH="$(pg_config --bindir):$PATH"
          npm run test:bootstrap-integration
