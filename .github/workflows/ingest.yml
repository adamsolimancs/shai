name: Ingestion Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh all stages, including recently completed checkpoints
        type: boolean
        default: false
      probe_only:
        description: Test NBA source access without writing to the database
        type: boolean
        default: false
      api_nba_probe:
        description: Read-only API-NBA free-plan qualification (at most 10 requests)
        type: boolean
        default: false

# Scheduled and manual runs share one writer; never cancel an active ingestion.
concurrency:
  group: production-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ !inputs.api_nba_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check ingest window
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          hour=$(TZ="America/New_York" date +%H)
          minute=$(TZ="America/New_York" date +%M)
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ "$hour" -ge 15 ] || [ "$hour" -lt 3 ]; then
            echo "run_worker=true" >> "$GITHUB_OUTPUT"
          elif [ "$minute" -eq 00 ] && [ $((10#$hour % 3)) -eq 0 ]; then
            echo "run_worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_worker=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.schedule.outputs.run_worker == 'true'
      - uses: actions/setup-node@v6
        if: steps.schedule.outputs.run_worker == 'true'
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        if: steps.schedule.outputs.run_worker == 'true'
        with:
          python-version: '3.11'
      - name: Install worker deps
        if: steps.schedule.outputs.run_worker == 'true'
        run: npm ci --prefix workers
      - name: Install nba_api bridge deps
        if: steps.schedule.outputs.run_worker == 'true'
        run: python -m pip install nba_api==1.11.4
      - name: Run worker
        if: steps.schedule.outputs.run_worker == 'true' && !inputs.probe_only
        env:
          REFRESH: ${{ inputs.refresh }}
          HISTORIC_SEASONS_BACK: 0
          PLAYERS_HISTORIC_MODE: "off"
          PLAYERS_HISTORIC_SEASONS_BACK: 0
          NBA_SEASON: "2026-27"
          API_MIN_INTERVAL_MS: 1500
          STATS_TRANSPORT: nba_api
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SCHEMA: public
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CACHE_KEY_PREFIX: nba:serve
          NBA_TIME_ZONE: America/New_York
        run: |
          args=()
          if [ "$REFRESH" = true ]; then args+=(--refresh); fi
          node workers/bootstrap.js "${args[@]}"
      - name: Verify NBA source access
        if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.probe_only && steps.schedule.outputs.run_worker == 'true' }}
        env:
          NBA_SEASON: "2026-27"
          API_MIN_INTERVAL_MS: 1500
          STATS_TRANSPORT: nba_api
        run: node workers/bootstrap.js --check-sources
      - name: Verify NBA CDN and longer-timeout stats access
        if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && steps.schedule.outputs.run_worker == 'true' }}
        run: python workers/check-live-sources.py
  api-nba-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.api_nba_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check API-NBA free-plan current-season coverage
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: node workers/check-api-nba.js
