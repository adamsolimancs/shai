name: Daily hoopR import

on:
  schedule:
    - cron: "23 10 * * *"
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      slate_date:
        description: Completed Eastern slate the publication must include (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hoopr-overnight
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install worker dependencies
        working-directory: workers
        run: npm ci
      - name: Install nba_api bridge
        run: python -m pip install nba_api==1.11.4
      - name: Publish and verify main database
        env:
          EXPECTED_SLATE: ${{ inputs.slate_date }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          CACHE_KEY_PREFIX: nba:serve
          STATS_TIMEOUT_MS: "5000"
          STATS_RETRY_MAX: "0"
        run: |
          set -o pipefail
          node workers/morning.js | tee "$RUNNER_TEMP/morning-publication.jsonl"
          {
            echo '### Verified NBA database publication'
            echo '```json'
            grep '"event":"verified_publication"' "$RUNNER_TEMP/morning-publication.jsonl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
